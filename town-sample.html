<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>わたしの街 サンプル</title>
<style>
  html,body{margin:0;height:100%;background:#1b1530;overflow:hidden;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}
  canvas{display:block;width:100vw;height:100dvh}
  .bar{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px);padding-top:max(10px,env(safe-area-inset-top));background:linear-gradient(rgba(20,12,40,.85),rgba(20,12,40,0))}
  .bar b{font-size:17px;flex:1;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .bar button{border:0;border-radius:999px;padding:7px 12px;font:inherit;font-weight:800;font-size:13px;color:#3a2a00;background:#ffd34d;box-shadow:0 2px 0 #c98a00}
  .hint{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));padding:9px 12px;border-radius:14px;background:rgba(20,12,40,.78);font-size:12.5px;line-height:1.6;text-align:center}
  .pop{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);min-width:220px;max-width:86vw;padding:10px 14px;border-radius:16px;background:#fff8e6;color:#4a3520;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.35);display:none}
  .pop b{display:block;font-size:16px;margin-bottom:2px}
</style></head><body>
<canvas id="cv"></canvas>
<div class="bar"><b>🏝 わたしの街（サンプル）</b><button id="tm">🕒 時間</button></div>
<div class="pop" id="pop"></div>
<div class="hint">ドラッグで移動・2本指で拡大／建物を<b>長押し</b>で持ち上げて動かせる・タップで情報</div>
<script>
/* 2026-11-25 あつ森風の街のサンプル（本体とは別ページ・データは保存しない）。
   建物の絵は仮（コードで描いている）。本番は斜め上から見た建物の絵に差し替える。住人は今の立ち絵を小さくして歩かせている */
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const T = 48, W = 26, H = 22;                    // マス・島の大きさ
let dpr = 1, vw = 0, vh = 0;
function resize(){ dpr = Math.min(2, devicePixelRatio || 1); vw = innerWidth; vh = innerHeight; cv.width = vw * dpr; cv.height = vh * dpr; }
addEventListener('resize', resize); resize();
// ---- 地面：0海 1砂 2草 3道 4川
const G = []; const rnd = (a => () => (a = (a * 1664525 + 1013904223) >>> 0) / 4294967296)(7);
for (let y = 0; y < H; y++) { G.push([]); for (let x = 0; x < W; x++) {
  const dx = (x - W / 2 + .5) / (W / 2), dy = (y - H / 2 + .5) / (H / 2), d = Math.sqrt(dx * dx * 1.0 + dy * dy * 1.1) + (rnd() - .5) * .06;
  G[y].push(d > 1 ? 0 : d > .86 ? 1 : 2); } }
for (let y = 0; y < H; y++) { const x = Math.round(5 + y * 0.35 + Math.sin(y / 2.5) * 1.2); for (const k of [x, x + 1]) if (G[y][k] === 2) G[y][k] = 4; }   // 川
const bridge = {x: 0, y: 11}; bridge.x = G[11].findIndex(v => v === 4);
G[11][bridge.x] = 3; G[11][bridge.x + 1] = 3;
for (let x = bridge.x; x < W - 4; x++) if (G[11][x] === 2) G[11][x] = 3;      // 道
for (let y = 5; y < H - 4; y++) if (G[y][15] === 2) G[y][15] = 3;
// ---- 物（建物・木）
const BLD = {
  home:   {n: '自分の家', wall: '#fff3dc', roof: '#e0565a', sign: '🏠', d: '本拠地。家のレベルで土地が広がる'},
  shop:   {n: '商店', wall: '#fff7e8', roof: '#4fa8ff', sign: '🛒', d: 'シルバーのもうけ'},
  tavern: {n: '酒場', wall: '#f4e1c4', roof: '#8a5a3c', sign: '🍺', d: '人口と少しのもうけ'},
  casino: {n: 'カジノ', wall: '#2b2140', roof: '#ffbf1f', sign: '🎰', d: 'もうけとルーレット'},
  petshop:{n: 'ペットショップ', wall: '#fff0f6', roof: '#ff8fc0', sign: '🐾', d: 'ペットをお迎え'},
  hunter: {n: 'ハンター協会', wall: '#e9d8b8', roof: '#5f8a3c', sign: '🏹', d: '魔物素材と肉'},
  castle: {n: '城', wall: '#f2f2f7', roof: '#6c5ce7', sign: '🏰', d: '税金が入る'},
};
const objs = [
  {k: 'home', x: 16, y: 10}, {k: 'shop', x: 18, y: 13}, {k: 'tavern', x: 12, y: 13}, {k: 'castle', x: 15, y: 5},
  {k: 'casino', x: 20, y: 8}, {k: 'petshop', x: 11, y: 8}, {k: 'hunter', x: 4, y: 14},
];
objs.forEach(o => o.t = 'b');
const trees = []; for (let i = 0; i < 70; i++) { const x = Math.floor(rnd() * W), y = Math.floor(rnd() * H); if (G[y][x] === 2 && !occupied(x, y, 1)) trees.push({t: 't', x, y, s: .8 + rnd() * .4, fruit: rnd() < .3}); }
const flowers = []; for (let i = 0; i < 90; i++) { const x = rnd() * W, y = rnd() * H; if (G[y | 0][x | 0] === 2) flowers.push({x, y, c: ['#ff6b8a', '#ffd34d', '#ffffff', '#b98cff'][i % 4]}); }
function occupied(x, y, sz, skip){ for (const o of objs) if (o !== skip && x < o.x + 2 && x + sz > o.x && y < o.y + 2 && y + sz > o.y) return true;
  for (const t of trees) if (t !== skip && x <= t.x && t.x < x + sz && y <= t.y && t.y < y + sz) return true; return false; }
// ---- 住人（今の立ち絵を小さく）・ペット
const IDS = ['ichigo', 'mocha', 'rinpan', 'kagura', 'ciel', 'chiyo', 'windy', 'nefer'];
const SAY = ['いい天気！', 'お店に行こうかな', 'ふぁ〜', 'パズルしたい！', '♪', 'こんにちは！', 'お腹すいた…', 'いい街だね'];
const PETS = ['🐕', '🐈', '🐇', '🐙'];
const walkers = [];
IDS.forEach((id, i) => { const im = new Image(); im.src = 'img/stand/' + id + '.webp'; walkers.push(spawn({im, sp: 38 + rnd() * 18})); });
PETS.forEach(e => walkers.push(spawn({emo: e, sp: 55})));
function walkable(x, y){ const g = G[y] && G[y][x]; return (g === 1 || g === 2 || g === 3) && !occupied(x, y, 1); }
function spawn(w){ let x, y; do { x = Math.floor(rnd() * W); y = Math.floor(rnd() * H); } while (!walkable(x, y)); return Object.assign(w, {x: x + .5, y: y + .5, tx: x + .5, ty: y + .5, wait: rnd() * 2, dir: 1, ph: rnd() * 6, say: '', sayT: 0}); }
function pickTarget(w){ for (let i = 0; i < 20; i++) { const x = Math.floor(w.x + (rnd() - .5) * 10), y = Math.floor(w.y + (rnd() - .5) * 8); if (walkable(x, y) && lineOk(w.x, w.y, x + .5, y + .5)) { w.tx = x + .5; w.ty = y + .5; return; } } w.wait = 1; }
function lineOk(ax, ay, bx, by){ const n = Math.ceil(Math.hypot(bx - ax, by - ay) * 3); for (let i = 1; i <= n; i++) { const x = ax + (bx - ax) * i / n, y = ay + (by - ay) * i / n; const g = G[y | 0] && G[y | 0][x | 0]; if (!(g === 1 || g === 2 || g === 3)) return false; for (const o of objs) if (x > o.x && x < o.x + 2 && y > o.y && y < o.y + 2) return false; } return true; }
// ---- カメラ
let cam = {x: 15 * T, y: 11 * T, z: .75};
const toScreen = (wx, wy) => [(wx - cam.x) * cam.z + vw / 2, (wy - cam.y) * cam.z + vh / 2];
const toWorld = (sx, sy) => [(sx - vw / 2) / cam.z + cam.x, (sy - vh / 2) / cam.z + cam.y];
// ---- 時間の色
const TIMES = [{n: '朝', c: 'rgba(255,190,120,.12)'}, {n: '昼', c: 'rgba(0,0,0,0)'}, {n: '夕方', c: 'rgba(255,120,60,.22)'}, {n: '夜', c: 'rgba(20,20,80,.45)'}];
let tIdx = (h => h < 9 && h >= 5 ? 0 : h < 16 ? 1 : h < 19 ? 2 : 3)(new Date().getHours());
const tmBtn = document.getElementById('tm'); const setTm = () => tmBtn.textContent = '🕒 ' + TIMES[tIdx].n; setTm();
tmBtn.onclick = () => { tIdx = (tIdx + 1) % 4; setTm(); };
// ---- 描く
function drawGround(t){
  const x0 = Math.max(0, Math.floor(toWorld(0, 0)[0] / T) - 1), y0 = Math.max(0, Math.floor(toWorld(0, 0)[1] / T) - 1);
  const x1 = Math.min(W, Math.ceil(toWorld(vw, vh)[0] / T) + 1), y1 = Math.min(H, Math.ceil(toWorld(vw, vh)[1] / T) + 1);
  cx.fillStyle = '#4fb6d8'; cx.fillRect(-1e4, -1e4, 2e4, 2e4);
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
    const g = G[y][x], px = x * T, py = y * T;
    if (g === 0) { if ((x + y + Math.floor(t * 1.5)) % 7 === 0) { cx.strokeStyle = 'rgba(255,255,255,.35)'; cx.lineWidth = 2; cx.beginPath(); cx.arc(px + 24, py + 30, 9, Math.PI * 1.1, Math.PI * 1.9); cx.stroke(); } continue; }
    cx.fillStyle = g === 1 ? '#f3e2a6' : g === 3 ? '#d9c08c' : g === 4 ? '#5ec4e6' : ((x + y) % 2 ? '#7cc95a' : '#74c254');
    cx.fillRect(px, py, T + .5, T + .5);
    if (g === 2 && G[y + 1] && G[y + 1][x] === 1) { cx.fillStyle = '#5ea43f'; cx.fillRect(px, py + T - 6, T + .5, 6); }      // 草のふち
    if (g === 4) { cx.fillStyle = 'rgba(255,255,255,.35)'; cx.fillRect(px + ((t * 20 + y * 13) % T), py + 18, 10, 3); }
    if (g === 3) { cx.fillStyle = 'rgba(0,0,0,.06)'; cx.fillRect(px + 6, py + 8, 6, 4); cx.fillRect(px + 30, py + 28, 8, 4); }
  }
  // 橋
  cx.fillStyle = '#b07a46'; cx.fillRect(bridge.x * T, 11 * T + 4, T * 2, T - 8); cx.fillStyle = '#8a5a30'; for (let i = 0; i < 6; i++) cx.fillRect(bridge.x * T + i * 16, 11 * T + 4, 2, T - 8);
  flowers.forEach(f => { cx.fillStyle = f.c; cx.beginPath(); cx.arc(f.x * T, f.y * T, 3, 0, 7); cx.fill(); });
}
function drawTree(o){
  const px = o.x * T + T / 2, py = o.y * T + T - 6, s = o.s;
  cx.fillStyle = 'rgba(0,0,0,.18)'; cx.beginPath(); cx.ellipse(px, py, 18 * s, 6 * s, 0, 0, 7); cx.fill();
  cx.fillStyle = '#8a5a30'; cx.fillRect(px - 4 * s, py - 22 * s, 8 * s, 22 * s);
  cx.fillStyle = '#3f9a45'; cx.beginPath(); cx.arc(px, py - 38 * s, 22 * s, 0, 7); cx.fill();
  cx.fillStyle = '#55b85a'; cx.beginPath(); cx.arc(px - 6 * s, py - 44 * s, 13 * s, 0, 7); cx.fill();
  if (o.fruit) { cx.fillStyle = '#ff5a5a'; [[-10, -32], [8, -40], [2, -26]].forEach(([a, b]) => { cx.beginPath(); cx.arc(px + a * s, py + b * s, 3.5 * s, 0, 7); cx.fill(); }); }
}
function drawBld(o, lift){
  const b = BLD[o.k], px = o.x * T, py = o.y * T - (lift ? 14 : 0), w = T * 2, h = T * 2;
  cx.fillStyle = 'rgba(0,0,0,.2)'; cx.beginPath(); cx.ellipse(px + w / 2, o.y * T + h - 4, w * .55, 12, 0, 0, 7); cx.fill();
  const wallTop = py + h * .38;
  cx.fillStyle = b.wall; rr(px + 8, wallTop, w - 16, h * .62 - 4, 6); cx.fill(); cx.strokeStyle = 'rgba(0,0,0,.25)'; cx.lineWidth = 2; cx.stroke();
  cx.fillStyle = '#8a5a30'; rr(px + w / 2 - 10, py + h - 34, 20, 30, 6); cx.fill();               // とびら
  cx.fillStyle = '#bfe6ff'; rr(px + 16, wallTop + 12, 16, 14, 3); cx.fill(); rr(px + w - 32, wallTop + 12, 16, 14, 3); cx.fill();
  cx.fillStyle = b.roof; cx.beginPath(); cx.moveTo(px + 1, wallTop + 6); cx.lineTo(px + w / 2, py + 4); cx.lineTo(px + w - 1, wallTop + 6); cx.closePath(); cx.fill(); cx.stroke();
  cx.font = '22px system-ui'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(b.sign, px + w / 2, wallTop - 14);
}
function rr(x, y, w, h, r){ cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }
function drawWalker(w, t){
  const px = w.x * T, py = w.y * T, moving = Math.hypot(w.tx - w.x, w.ty - w.y) > .05 && w.wait <= 0, bob = moving ? Math.abs(Math.sin(t * 10 + w.ph)) * 4 : Math.sin(t * 2 + w.ph);
  cx.fillStyle = 'rgba(0,0,0,.2)'; cx.beginPath(); cx.ellipse(px, py + 2, 12, 4, 0, 0, 7); cx.fill();
  cx.save(); cx.translate(px, py - bob); if (w.dir < 0) cx.scale(-1, 1);
  if (w.im && w.im.complete && w.im.naturalWidth) { const s = 58, iw = w.im.naturalWidth, ih = w.im.naturalHeight, sh = Math.min(ih, iw); cx.drawImage(w.im, 0, ih - sh, iw, sh, -s / 2, -s, s, s); }
  else { cx.font = '26px system-ui'; cx.textAlign = 'center'; cx.textBaseline = 'bottom'; cx.fillText(w.emo || '🙂', 0, 2); }
  cx.restore();
  if (w.sayT > 0) { cx.font = 'bold 12px system-ui'; const tw = cx.measureText(w.say).width + 14; cx.fillStyle = '#fff'; rr(px - tw / 2, py - 84, tw, 22, 10); cx.fill();
    cx.beginPath(); cx.moveTo(px - 4, py - 62); cx.lineTo(px + 4, py - 62); cx.lineTo(px, py - 56); cx.fill(); cx.fillStyle = '#4a3520'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(w.say, px, py - 73); }
}
let drag = null, held = null, last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000), t = now / 1000; last = now;
  walkers.forEach(w => {
    w.sayT -= dt; if (w.wait > 0) { w.wait -= dt; if (w.wait <= 0) pickTarget(w); return; }
    const dx = w.tx - w.x, dy = w.ty - w.y, d = Math.hypot(dx, dy);
    if (d < .05) { w.wait = 1 + rnd() * 3; if (!w.emo && rnd() < .35) { w.say = SAY[Math.floor(rnd() * SAY.length)]; w.sayT = 2.5; } return; }
    const st = Math.min(d, w.sp / T * dt); w.x += dx / d * st; w.y += dy / d * st; if (Math.abs(dx) > .02) w.dir = dx > 0 ? 1 : -1;
  });
  cx.setTransform(dpr * cam.z, 0, 0, dpr * cam.z, dpr * (vw / 2 - cam.x * cam.z), dpr * (vh / 2 - cam.y * cam.z));
  drawGround(t);
  const list = [...trees.map(o => ({y: o.y + 1, f: () => drawTree(o)})), ...objs.filter(o => o !== held).map(o => ({y: o.y + 2, f: () => drawBld(o)})), ...walkers.map(w => ({y: w.y, f: () => drawWalker(w, t)}))];
  list.sort((a, b) => a.y - b.y).forEach(o => o.f());
  if (held) { const ok = !occupied(held.x, held.y, 2, held) && [0, 1].every(a => [0, 1].every(b => [1, 2, 3].includes(G[held.y + b] && G[held.y + b][held.x + a])));
    cx.fillStyle = ok ? 'rgba(120,255,140,.35)' : 'rgba(255,90,90,.35)'; cx.fillRect(held.x * T, held.y * T, T * 2, T * 2); held.ok = ok; drawBld(held, true); }
  cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.fillStyle = TIMES[tIdx].c; cx.fillRect(0, 0, vw, vh);
  if (tIdx === 3) objs.forEach(o => { const [sx, sy] = toScreen(o.x * T + T, o.y * T + T * 1.5); const g = cx.createRadialGradient(sx, sy, 0, sx, sy, 70 * cam.z); g.addColorStop(0, 'rgba(255,220,120,.35)'); g.addColorStop(1, 'rgba(255,220,120,0)'); cx.fillStyle = g; cx.fillRect(sx - 80 * cam.z, sy - 80 * cam.z, 160 * cam.z, 160 * cam.z); });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// ---- 操作
const pts = new Map(); let pinch = null, lpTimer = 0, moved = false;
const pop = document.getElementById('pop'); let popT = 0;
function showPop(h){ pop.innerHTML = h; pop.style.display = 'block'; clearTimeout(popT); popT = setTimeout(() => pop.style.display = 'none', 2600); }
const bldAt = (wx, wy) => objs.find(o => wx >= o.x * T && wx < (o.x + 2) * T && wy >= o.y * T && wy < (o.y + 2) * T);
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); moved = false;
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = {d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: cam.z}; clearTimeout(lpTimer); drag = null; return; }
  drag = {sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y};
  const [wx, wy] = toWorld(e.clientX, e.clientY), o = bldAt(wx, wy);
  if (o) lpTimer = setTimeout(() => { held = o; held.ox = o.x; held.oy = o.y; drag = null; navigator.vibrate && navigator.vibrate(20); }, 450);
});
cv.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && pts.size === 2) { const [a, b] = [...pts.values()]; cam.z = Math.max(.5, Math.min(2.2, pinch.z * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d)); return; }
  if (held) { const [wx, wy] = toWorld(e.clientX, e.clientY); held.x = Math.round(wx / T - 1); held.y = Math.round(wy / T - 1.3); return; }
  if (drag) { const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy; if (Math.hypot(dx, dy) > 6) { moved = true; clearTimeout(lpTimer); }
    cam.x = Math.max(0, Math.min(W * T, drag.cx - dx / cam.z)); cam.y = Math.max(0, Math.min(H * T, drag.cy - dy / cam.z)); }
});
function up(e){
  pts.delete(e.pointerId); clearTimeout(lpTimer);
  if (pts.size < 2) pinch = null;
  if (held) { if (!held.ok) { held.x = held.ox; held.y = held.oy; showPop('ここには置けません'); } else showPop('<b>' + BLD[held.k].n + '</b>を動かしました'); held = null; drag = null; return; }
  if (drag && !moved) { const [wx, wy] = toWorld(e.clientX, e.clientY), o = bldAt(wx, wy);
    const w = walkers.find(w => Math.hypot(w.x * T - wx, w.y * T - 28 - wy) < 26);
    if (o) showPop('<b>' + BLD[o.k].sign + ' ' + BLD[o.k].n + '</b>' + BLD[o.k].d);
    else if (w) { w.say = w.emo ? '♪' : SAY[Math.floor(rnd() * SAY.length)]; w.sayT = 2.5; } }
  drag = null;
}
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { e.preventDefault(); cam.z = Math.max(.5, Math.min(2.2, cam.z * (e.deltaY < 0 ? 1.1 : .9))); }, {passive: false});
</script>
</body></html>

<script type="module">
// 2026-11-28 本人「アイコンは画像で（端末によって表示が違う）」：コインは絵。ほかは絵がとどいたら TWIC_ART=true（ゲーム側と同じ img/town3d/ic/）
const TWIC_ART = true, ICE = {box: '📦', xp: '🥋', crane: '🏗', tree: '🌳', list: '📋', angle: '📐', clock: '🕒'};
const IC = k => k === 'silver' || k === 'tc' ? '<img class="ic tcn" alt="街コイン" src="img/gacha/coin_silver.webp">' : TWIC_ART ? '<img class="ic" alt="" src="img/town3d/ic/' + k + '.webp">' : (ICE[k] || '');
/* 2026-11-26 わたしの街（3Dの島）
   本人：「建物・木・地面は3D、キャラは2Dのちび絵を板にして立たせる。ペーパーマリオ風」「最初から3Dで」
         「最初はまっさらで、自宅と島と川があるだけ、道も1本くらい。マップは5種類から選べる（川の位置や島の形が違う）」
         「最初からズームで、ピンチで引ける」「木とか道とかは自分で置ける」
   2026-11-26 作りなおし（マス目）：本人「小さいマス1×1が基本で、自分の家3×3、農場5×5、道は土の1×1をつなげて道にする。全部同じ大きさってナンセンス」
         「マップも正直小さい」「木って括らない方が良い。素材一つ一つに大きさを設定」「グレードを上げたら大きくなる」
         「大きくなるとき周りがふさがっていたら → A：まわりを空けてね と出てレベルアップできない」
   ・街の仕組み（建てる・育てる・お金）はゲーム（index.html）側。ここは描くのと、置く・けす・場所えらびだけ
   ・大きさの表はここ（BSZ／DSZ）だけにある。ゲームには「次のレベルの広さが空いているか」を伝える */
import * as THREE from 'three';
const $ = id => document.getElementById(id);
const renderer = new THREE.WebGLRenderer({antialias: false});
const DPR = Math.min(2, devicePixelRatio || 1);
renderer.setPixelRatio(DPR); renderer.setSize(innerWidth, innerHeight); document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.5, 1500);
// カメラの角度（2026-11-26 本人「角度を変えられる」）：上から45度／ななめ30度／横から18度
const ANGLES = [{n: '上から', p: Math.PI / 4}, {n: 'ななめ', p: Math.PI / 6}, {n: '横から', p: Math.PI / 10}];
let angI = (() => { try { return +localStorage.getItem('twistrush.tw3dAng') || 0; } catch (_) { return 0; } })() % 3; let PITCH = ANGLES[angI].p;
const BEND = {value: 0.0012};
function bend(m){ m.onBeforeCompile = sh => { sh.uniforms.uBend = BEND; sh.vertexShader = 'uniform float uBend;\n' + sh.vertexShader.replace('#include <project_vertex>', '#include <project_vertex>\n  mvPosition.y -= mvPosition.z * mvPosition.z * uBend;\n  gl_Position = projectionMatrix * mvPosition;'); }; return m; }
let reqN = 0; const waits = {};
const send = m => { try { parent !== window && parent.postMessage(Object.assign({src: 'tw3d'}, m), location.origin); } catch (_) {} };
const req = (op, p) => new Promise(res => { if (parent === window) return res({ok: true, coins: 99999}); const id = ++reqN; waits[id] = res; send(Object.assign({type: 'req', id, op}, p)); setTimeout(() => { if (waits[id]) { delete waits[id]; res({ok: false, msg: 'つながりませんでした'}); } }, 4000); });
const toast = t => { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.k); toast.k = setTimeout(() => e.classList.remove('on'), 1900); };

// ---- 大きさの表（マスの数）。ここを変えれば全部に効く
// 建物：レベル1〜5の広さ（正方形の1辺）
const BSZ = {home: [3, 3, 4, 4, 5], castle: [5, 5, 6, 7, 8], farm: [4, 5, 5, 6, 7],
  house: [2, 2, 3, 3, 3], shop: [2, 2, 3, 3, 3], petshop: [2, 2, 3, 3, 3], alchemy: [2, 2, 3, 3, 3], hunter: [2, 2, 3, 3, 3],
  tavern: [3, 3, 3, 4, 4], lumber: [3, 3, 3, 4, 4], quarry: [3, 3, 3, 4, 4], iron: [3, 3, 3, 4, 4], dojo: [3, 3, 3, 4, 4],
  casino: [3, 4, 4, 5, 5], trial: [3, 4, 4, 5, 5]};
const bsz = (b, lv) => (BSZ[b] || [2, 2, 2, 2, 2])[Math.max(1, Math.min(5, lv || 1)) - 1];
// 飾り：[よこ, たて, 絵の高さ]
const DSZ = {lamp1: [1, 1, 2.4], flower1: [1, 1, 1.5], bench1: [1, 1, 1.5], tree3: [1, 1, 2.7], bush1: [1, 1, 1.5], fence1: [2, 1, 1.8],
  rock1: [2, 2, 2.3], tree4: [2, 2, 3.0], fountain1: [2, 2, 3.0], tree1: [3, 3, 4.6], tree2: [3, 3, 4.6],
  wall1: [1, 1, 2.0], wall2: [1, 1, 2.2], wall3: [1, 1, 2.8], gate1: [3, 1, 3.2], tower1: [2, 2, 4.6]};
const dsz = k => DSZ[k] || [1, 1, 2];

// ---- 島（5種類）：形の式 R(a) = base + Σ amp*sin(fr*a+ph)、川（折れ線・何本でも）、自分の家の場所。SC倍に広げて使う
const SC = 2;
const MAPS0 = [
  {n: 'まんまる島', d: 'まるい島のまん中を、川がゆるやかに流れる', base: 16.5, amp: [1.0, .6, .3, 0], fr: [3, 5, 8, 2], ph: [.4, 1, 0, 0], rivers: [[[-3, -24], [-4, -10], [-1, 0], [-5, 10], [-3, 24]]], home: [4.5, 1]},
  {n: 'ふたご島', d: '2つの丘がくっついた島。くびれを川が横切る', base: 15.2, amp: [3.4, .5, .3, 0], fr: [2, 5, 7, 1], ph: [1.5708, 1, .5, 0], rivers: [[[-1.5, -24], [.5, -10], [-1, 0], [1, 10], [-.5, 24]]], home: [-8, 1]},
  {n: 'みかづき島', d: '片側がふくらんだ島。川がななめに流れる', base: 16, amp: [2.2, .8, .4, 0], fr: [1, 3, 6, 2], ph: [0, .3, 1.2, 0], rivers: [[[-22, -18], [-9, -7], [0, -1], [8, 8], [20, 20]]], home: [-4, 7]},
  {n: 'ぎざぎざ島', d: '入り江の多い島。川は島のはしを流れる', base: 16, amp: [.8, 1.1, .9, .5], fr: [4, 7, 11, 3], ph: [.2, 1.4, .7, 2], rivers: [[[11, -24], [10, -10], [12, 0], [9, 12], [11, 24]]], home: [-2, 0]},
  {n: 'わかれ川の島', d: '大きな島を、2つにわかれた川が流れる', base: 17, amp: [1.2, .5, .3, 0], fr: [3, 5, 9, 2], ph: [1, 2, 0, 0], rivers: [[[-2, -24], [-1, -12], [0, -4]], [[0, -4], [-8, 4], [-13, 24]], [[0, -4], [7, 5], [13, 24]]], home: [0, 6]},
];
const MAPS = MAPS0.map(m => Object.assign({}, m, {base: m.base * SC, amp: m.amp.map(a => a * SC), rivers: m.rivers.map(L => L.map(([x, z]) => [x * SC, z * SC])), home: [m.home[0] * SC, m.home[1] * SC]}));
let M = MAPS[0];
const R = a => M.base + M.amp[0] * Math.sin(M.fr[0] * a + M.ph[0]) + M.amp[1] * Math.sin(M.fr[1] * a + M.ph[1]) + M.amp[2] * Math.sin(M.fr[2] * a + M.ph[2]) + M.amp[3] * Math.sin(M.fr[3] * a + M.ph[3]);
function shapeOf(off){ const s = new THREE.Shape(); for (let i = 0; i <= 240; i++) { const a = i / 240 * Math.PI * 2, r = R(a) + off; const x = Math.cos(a) * r, y = Math.sin(a) * r; i ? s.lineTo(x, y) : s.moveTo(x, y); } return s; }
const inIsland = (x, z, m = 0) => Math.hypot(x, z) < R(Math.atan2(-z, x)) - m;
const distSeg = (px, pz, ax, az, bx, bz) => { const dx = bx - ax, dz = bz - az, t = Math.max(0, Math.min(1, ((px - ax) * dx + (pz - az) * dz) / (dx * dx + dz * dz))); return Math.hypot(px - ax - dx * t, pz - az - dz * t); };
const distLine = (px, pz, L) => { let d = 1e9; for (let i = 1; i < L.length; i++) d = Math.min(d, distSeg(px, pz, L[i - 1][0], L[i - 1][1], L[i][0], L[i][1])); return d; };
const riverD = (x, z) => Math.min(...M.rivers.map(L => distLine(x, z, L)));
const RW = 1.7;                                              // 川のはば（半分）
let sd = 11; const rnd = () => (sd = (sd * 1664525 + 1013904223) >>> 0) / 4294967296;

// ---- マス目（1マス＝1）。マス(ix,iz) は x:ix〜ix+1、z:iz〜iz+1
const ck = (ix, iz) => ix + ',' + iz; const cxz = k => k.split(',').map(Number);
const cellLand = (ix, iz) => inIsland(ix + .5, iz + .5, .75) && riverD(ix + .5, iz + .5) > RW + .25;   // 建物や飾りや道を置ける地面
let roads = new Set();                   // 道のマス
const occ = new Map();                   // マス → そこにあるもの（建物・飾り）
const onRoad = (x, z) => roads.has(ck(Math.floor(x), Math.floor(z)));
const onRiver = (x, z) => riverD(x, z) < RW + .1;
function rectFree(x, z, w, d, self){ for (let i = x; i < x + w; i++) for (let j = z; j < z + d; j++) { const k = ck(i, j), o = occ.get(k); if (!cellLand(i, j) || roads.has(k) || (o && o !== self)) return false; } return true; }
function claim(o){ for (let i = o.cx; i < o.cx + o.w; i++) for (let j = o.cz; j < o.cz + o.d; j++) occ.set(ck(i, j), o); }
function unclaim(o){ occ.forEach((v, k) => { if (v === o) occ.delete(k); }); }

// ---- 世界（島を変えたら全部作りなおす）
let world = null, DATA = null, PRICE = {}, oTex = null, oCan = null;
const sprites = [], walkers = [], decoS = [], blds = [];
const lam = o => bend(new THREE.MeshLambertMaterial(o));
const loader = new THREE.TextureLoader(), TEX = {};
function tex(url, paper){ if (typeof url !== 'string') return url; const key = url + (paper ? '#p' : ''); if (TEX[key]) return TEX[key];
  if (!paper) { const t = loader.load(url); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return TEX[key] = t; }
  // 紙の切り抜き（2026-11-26 ペーパーマリオ風）：絵のまわりに白いふち＋うすい紙の影
  const c = document.createElement('canvas'); c.width = c.height = 8; const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  const im = new Image(); im.onload = () => { const W = im.naturalWidth, H = im.naturalHeight, p = Math.max(2, Math.round(W * .02)); c.width = W; c.height = H; const g = c.getContext('2d');
    const k = document.createElement('canvas'); k.width = W; k.height = H; const kg = k.getContext('2d');
    for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2; kg.drawImage(im, Math.cos(a) * p, Math.sin(a) * p); }
    kg.globalCompositeOperation = 'source-in'; kg.fillStyle = '#fffdf6'; kg.fillRect(0, 0, W, H);
    g.globalAlpha = .25; g.drawImage(k, p * .6, p * .9); g.globalAlpha = 1; g.filter = 'brightness(0)'; g.globalAlpha = .18; g.drawImage(k, p * .6, p * .9); g.filter = 'none'; g.globalAlpha = 1;
    g.drawImage(k, 0, 0); g.drawImage(im, 0, 0); t.dispose(); t.image = c; t.needsUpdate = true; };

  const o = s.o, c = o.kind === 'ofc' ? 0 : o.kind === 'bld' ? PRICE.moveB : PRICE.move; toast('指をずらして、はなすと置けます' + (c ? '（街コイン ' + c + '）' : '（無料）')); showGhost(o.cx, o.cz, o.w, o.d, true); }
function lpMove(cx, cy){ const o = lp.o, [x, z] = groundAt(cx, cy), [nx, nz] = cellFor(x, z, o.w, o.d); lp.nx = nx; lp.nz = nz;
  const dx = nx - o.cx, dz = nz - o.cz; lp.s.grp.position.x = lp.x0 + dx; lp.s.grp.position.z = lp.z0 + dz; showGhost(nx, nz, o.w, o.d, rectFree(nx, nz, o.w, o.d, o)); }
function lpBack(){ if (!lp) return; lp.s.grp.position.set(lp.x0, GY, lp.z0); lp.s.mat.opacity = 1; ghost.visible = false; }
async function lpEnd(){ const L = lp; lp = null; ghost.visible = false; const o = L.o, {nx, nz} = L;
  if (nx === o.cx && nz === o.cz) { lp = L; lpBack(); lp = null; return; }
  if (!rectFree(nx, nz, o.w, o.d, o)) { lp = L; lpBack(); lp = null; return toast('ここには置けません（川・道・ほかのものと重なる）'); }
  const isB = o.kind === 'bld', isO = o.kind === 'ofc', s = L.s, r = isO ? await req('moveO', {x: nx, z: nz}) : isB ? await req('moveB', {i: o.i, x: nx, z: nz}) : await req('move', {d: s.d, to: {k: s.d.k, x: nx, z: nz}});
  if (!r.ok) { lp = L; lpBack(); lp = null; return toast(r.msg || 'お金が足りません'); }
  if (isO) { delOffice(); addOffice(nx, nz); } else if (isB) { const p = Object.assign({}, o.p, {x: nx, z: nz}); delBld(o); addBld(o.i, p); } else { delDeco(s); addDeco({k: s.d.k, x: nx, z: nz}); }
  setCoins(r.coins); send({type: 'room', room: roomAll()}); }
let painted = 0;
async function paintRoad(cx, cy, end){
  if (!end) { const [x, z] = groundAt(cx, cy), ix = Math.floor(x), iz = Math.floor(z), k = ck(ix, iz);
    if (roads.has(k) || !cellLand(ix, iz) || occ.has(k) || roads.size >= ROADMAX) return; roads.add(k); painted++; drawRoads(); return; }
  if (!painted) return; const n = painted; painted = 0; const r = await req('roads', {list: [...roads], add: n});
  if (!r.ok) { toast(r.msg || 'お金が足りません'); roads = new Set(DATA.roadsSaved || []); drawRoads(); return; } DATA.roadsSaved = [...roads]; setCoins(r.coins); send({type: 'room', room: roomAll()});
}
const setCoins = c => { if (c == null) return; coins = c; $('cn').innerHTML = IC('silver') + c.toLocaleString(); };

// ---- 島をえらぶ
let mapSel = 0;
function openMaps(change){ mapSel = DATA ? DATA.map ?? 0 : 0; endBuild();
  $('mapsp').textContent = change ? '島をかえると、置いた木・飾り・道はなくなります（建物はそのまま、新しい島にうつります）。' : '5つの島から、好きな形をえらべます。川の場所や島の形がちがいます。あとから「🌳 かざる」でかえられます。';
  $('maprow').innerHTML = MAPS.map((m, i) => '<button data-m="' + i + '"' + (i === mapSel ? ' class="sel"' : '') + '>' + m.n + '</button>').join('');
  $('maps').classList.add('on'); $('pal').classList.remove('on'); cam.dist = 150; cam.tx = 0; cam.tz = 14; }
const fresh = D => Object.assign({}, D, {roads: null, deco: [], grid: 2, plots: D.plots.map(p => p && p.t === 'bld' ? Object.assign({}, p, {x: undefined, z: undefined}) : p)});
$('maprow').onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; mapSel = +b.dataset.m; [...$('maprow').children].forEach((c, i) => c.classList.toggle('sel', i === mapSel));
  $('mapsp').textContent = MAPS[mapSel].d; const keep = DATA; build(fresh(keep), mapSel); DATA = keep; cam.dist = 150; cam.tx = 0; cam.tz = 14; };
$('mapok').onclick = async () => { const r = await req('pickMap', {map: mapSel}); if (!r.ok) return toast(r.msg || 'できませんでした');
  const D = fresh(DATA); D.map = mapSel; build(D, mapSel); $('maps').classList.remove('on');
  await saveLayout(); DATA.roadsSaved = [...roads]; setEdit(false); focusHome(); };
function focusHome(){ const h = blds.find(o => o.p.b === 'home'); cam.tx = h ? h.cx + h.w / 2 : M.home[0]; cam.tz = (h ? h.cz + h.d : M.home[1]) + 1; cam.dist = 26; }

// ---- 操作
const pts = new Map(); let drag = null, pinch = null, moved = 0; const el = renderer.domElement;
function tap(cx, cy){
  let best = null;
  sprites.forEach(s => { if (s.plot == null) return; const [x0, y0] = scr(s.x - s.h * .4, GY, s.z), [x1, y1] = scr(s.x + s.h * .4, GY + s.h * .9, s.z);
    if (cx >= Math.min(x0, x1) && cx <= Math.max(x0, x1) && cy >= Math.min(y0, y1) && cy <= Math.max(y0, y1) && (!best || s.z > best.z)) best = s; });
  if (!best) { const [x, z] = groundAt(cx, cy), o = occ.get(ck(Math.floor(x), Math.floor(z))); if (o && (o.kind === 'bld' || o.kind === 'ofc')) best = o.spr; }
  if (best && best.plot === 'office') return send({type: 'office'});
  if (best) send({type: 'tap', i: best.plot, room: roomAll()});
}
el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); moved = 0;
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = {d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: cam.dist}; drag = null; painted && paintRoad(0, 0, true); }
  else { drag = {x: e.clientX, y: e.clientY, tx: cam.tx, tz: cam.tz, road: edit && tool === 'road' && !moving}; if (drag.road) paintRoad(e.clientX, e.clientY);
    clearTimeout(lpT); if (!placing && !$('maps').classList.contains('on')) { const cx = e.clientX, cy = e.clientY, s = objAt(cx, cy);
      if (s) lpT = setTimeout(() => { if (pts.size === 1 && moved < 8 && drag) { if (drag.road) { painted = 0; roads = new Set(DATA.roadsSaved || []); drawRoads(); } drag = null; lpStart(s); } }, 450); } } });
let lpT = 0;
el.addEventListener('pointermove', e => { if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (lp) { lpMove(e.clientX, e.clientY); return; }
  if (pinch && pts.size === 2) { moved = 99; const [a, b] = [...pts.values()]; cam.dist = Math.max(ZMIN, Math.min(ZMAX, pinch.z * pinch.d / Math.hypot(a[0] - b[0], a[1] - b[1]))); return; }
  if (!drag) return; moved = Math.max(moved, Math.hypot(e.clientX - drag.x, e.clientY - drag.y));
  if (drag.road) { paintRoad(e.clientX, e.clientY); return; }
  const k = cam.dist / innerHeight * .55, lim = M.base + 6; cam.tx = Math.max(-lim, Math.min(lim, drag.tx - (e.clientX - drag.x) * k)); cam.tz = Math.max(-lim, Math.min(lim, drag.tz - (e.clientY - drag.y) * k * 1.4)); });
const up = e => { clearTimeout(lpT); if (lp) { pts.delete(e.pointerId); drag = null; lpEnd(); return; }
  if (pts.size === 1 && drag) { if (drag.road) paintRoad(0, 0, true); else if (moved < 8) { if ($('maps').classList.contains('on')) {} else if (placing) buildTap(e.clientX, e.clientY); else if (edit) editTap(e.clientX, e.clientY); else if (!blist) tap(e.clientX, e.clientY); } }
  pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) drag = null; };
el.addEventListener('pointerup', up); el.addEventListener('pointercancel', e => { clearTimeout(lpT); if (lp) { lpBack(); lp = null; } pts.delete(e.pointerId); pinch = null; drag = null; painted && paintRoad(0, 0, true); });
el.addEventListener('wheel', e => { e.preventDefault(); cam.dist = Math.max(ZMIN, Math.min(ZMAX, cam.dist * (e.deltaY > 0 ? 1.1 : .9))); }, {passive: false});
$('back').onclick = () => send({type: 'close'});
// 一覧ボタンはなくした（2026-11-28 本人「一覧いらなくない？見てもよくわからんし」）
$('cl').onclick = () => send({type: 'claim'});
loop();

// ---- ゲームから
function start(D){ const first = D.map == null; const mv = build(D, first ? 0 : D.map); DATA.roadsSaved = [...roads];
  if (first) openMaps(false); else { focusHome(); if (mv) saveLayout(); else send({type: 'room', room: roomAll()}); } }
addEventListener('message', e => { if (e.origin !== location.origin || !e.data || e.data.src !== 'game') return; const d = e.data;
  if (d.type === 'town' && d.town.name) $('tnm').textContent = d.town.name;
  if (d.type === 'town' && !DATA) { PRICE = d.town.price || {}; setCoins(d.town.coins); start(d.town); }
  if (d.type === 'hud') { const h = d.hud; $('clv').innerHTML = IC('silver') + h.silver.toLocaleString() + (h.n ? '・' + IC('box') + h.n : h.mats ? '・' + IC('xp') : ''); $('cl').classList.toggle('dot', h.silver > 0 || h.mats); setCoins(h.coins); }
  if (d.type === 'openBuild' && DATA && !$('maps').classList.contains('on')) openBuild();
  if (d.type === 'got') { const e = $('got'); e.innerHTML = d.list.length ? '<b>受け取りました</b>' + d.list.map(g => '<div>' + esc(g) + '</div>').join('') : '<b>まだたまっていません</b>'; e.classList.add('on'); clearTimeout(e.k); e.k = setTimeout(() => e.classList.remove('on'), 2600 + d.list.length * 700); }
  if (d.type === 'res' && waits[d.id]) { const f = waits[d.id]; delete waits[d.id]; f(d); } });
send({type: 'ready'});
setTimeout(() => { $('hint').style.opacity = 0; }, 7000);
setTimeout(() => { if (DATA) return;                       // 単体で開いたとき：見本
  PRICE = {road: 20, move: 50, moveB: 500, bridge1: 1000, bridge2: 2500, tree1: 600, tree2: 600, tree3: 200, tree4: 400, bush1: 200, flower1: 300, rock1: 150, fence1: 100, bench1: 400, lamp1: 500, fountain1: 2000};
  const D = {map: null, grid: 2, plots: Array.from({length: 25}, (_, i) => i === 12 ? {t: 'bld', b: 'home', lv: 1, img: 'img/town3d/home_1.webp', tag: '自分の家 Lv1'} : i === 7 ? {t: 'bld', b: 'farm', lv: 2, img: 'img/town3d/farm_2.webp', tag: '農場 Lv2'} : {t: 'empty'}),
    walkers: ['g20', 'g42', 'g51'].map(k => ({img: 'img/walk/' + k + '.webp'})), deco: [], roads: null};
  start(D); }, 1200);
</script>

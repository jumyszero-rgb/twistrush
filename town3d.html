<script type="module">
/* 2026-11-26 わたしの街（3Dの島）
   本人：「建物・木・地面は3D、キャラは2Dのちび絵を板にして立たせる。ペーパーマリオ風」「最初から3Dで」
         「最初はまっさらで、自宅と島と川があるだけ、道も1本くらい。マップは5種類から選べる（川の位置や島の形が違う）」

import * as THREE from 'three';

  {n: 'ぎざぎざ島', d: '入り江の多い島。川は島のはしを流れる', base: 16, amp: [.8, 1.1, .9, .5], fr: [4, 7, 11, 3], ph: [.2, 1.4, .7, 2], rivers: [[[11, -24], [10, -10], [12, 0], [9, 12], [11, 24]]], home: [-2, 0]},
  {n: 'わかれ川の島', d: '大きな島を、2つにわかれた川が流れる', base: 17, amp: [1.2, .5, .3, 0], fr: [3, 5, 9, 2], ph: [1, 2, 0, 0], rivers: [[[-2, -24], [-1, -12], [0, -4]], [[0, -4], [-8, 4], [-13, 24]], [[0, -4], [7, 5], [13, 24]]], home: [0, 6]},

const onRiver = (x, z) => riverD(x, z) < RW + .1;

// ---- 土地（25か所）
let PLOTS = [], POS = [];   // PLOTS：家から近い順の場所／POS[土地の番号]：その土地の場所（ゲームの「使える順」に合わせる）
function plotsOf(){
  const [hx, hz] = M.home; let out = [];
  for (const sp of [4.7, 4.4, 4.1, 3.8]) {
    const c = []; for (let x = -20; x <= 20; x += sp) for (let z = -20; z <= 20; z += sp) { const px = hx + Math.round((x) / sp) * sp, pz = hz + Math.round(z / sp) * sp;
      if (Math.hypot(px - hx, pz - hz) < .5) continue; if (!inIsland(px, pz, 2.4) || riverD(px, pz) < RW + 2.0) continue; if (c.some(p => Math.hypot(p[0] - px, p[1] - pz) < 1)) continue; c.push([px, pz]); }
    c.sort((a, b) => Math.hypot(a[0] - hx, a[1] - hz) - Math.hypot(b[0] - hx, b[1] - hz));
    out = [[hx, hz]].concat(c); if (out.length >= 25) break; }
  return out.slice(0, 25);

// ---- 世界（島を変えたら全部作りなおす）
let world = null, DATA = null, PRICE = {}, gTex = null, gCan = null, baseCan = null;

  x.fillStyle = '#5a3a00'; x.fillRect(56, 34, 16, 60); x.fillRect(34, 56, 60, 16); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return TEX.plus = t; }
const GY = .6;
function billboard(url, x, z, h, opt = {}){

  grp.add(mesh); grp.position.set(x, GY, z); if (opt.flip) mesh.scale.x = -1; world.add(grp);
  const s = Object.assign({grp, mesh, sh, mat: m, x, z, h}, opt); sprites.push(s); if (curT) m.color.set(curT.spr); return s; }
function unbill(s){ world.remove(s.grp); s.mat.dispose(); s.mesh.geometry.dispose(); const i = sprites.indexOf(s); if (i >= 0) sprites.splice(i, 1); if (s.tagE) { s.tagE.remove(); } }

// 地面の絵：草（島ごとに1回）＋川・道・空き地のしるし（変わるたびに描きなおす）
const TS = 2048, SPAN = 46, U = TS / SPAN; const P = (x, z) => [(x / SPAN + .5) * TS, (z / SPAN + .5) * TS];
function drawBase(){
  baseCan = document.createElement('canvas'); baseCan.width = baseCan.height = TS; const g = baseCan.getContext('2d'); sd = 11;
  g.fillStyle = '#7ccd5c'; g.fillRect(0, 0, TS, TS);
  for (let i = 0; i < 2600; i++) { const r = 6 + rnd() * 40; g.fillStyle = ['rgba(98,180,72,.35)', 'rgba(140,214,98,.35)', 'rgba(110,196,80,.3)'][i % 3]; g.beginPath(); g.ellipse(rnd() * TS, rnd() * TS, r, r * .7, rnd() * 3, 0, 7); g.fill(); }
  for (let i = 0; i < 9000; i++) { const x = rnd() * TS, y = rnd() * TS; g.strokeStyle = rnd() < .5 ? 'rgba(70,150,55,.55)' : 'rgba(170,230,120,.5)'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rnd() - .5) * 4, y - 5 - rnd() * 5); g.stroke(); }
  for (let i = 0; i < 380; i++) { const x = (rnd() - .5) * SPAN, z = (rnd() - .5) * SPAN; if (!inIsland(x, z, .8) || riverD(x, z) < RW + .6) continue;
    const [a, b] = P(x, z), c = ['#ff6b8a', '#ffd34d', '#ffffff', '#b98cff', '#ff9f43'][i % 5]; for (let k = 0; k < 5; k++) { g.fillStyle = c; g.beginPath(); g.arc(a + Math.cos(k * 1.26) * 3.4, b + Math.sin(k * 1.26) * 3.4, 2.8, 0, 7); g.fill(); } g.fillStyle = '#ffe9a8'; g.beginPath(); g.arc(a, b, 2, 0, 7); g.fill(); }

function drawGround(){

  const stroke = (L, w, c) => { g.strokeStyle = c; g.lineWidth = w; g.lineCap = g.lineJoin = 'round'; g.beginPath(); L.forEach(([x, z], i) => { const [a, b] = P(x, z); i ? g.lineTo(a, b) : g.moveTo(a, b); }); g.stroke(); };

    g.fillStyle = 'rgba(150,110,60,.4)'; g.beginPath(); g.roundRect(a - s, b - s * .8, s * 2, s * 1.6, 16); g.fill(); g.setLineDash([12, 9]); g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 4; g.stroke(); g.setLineDash([]); });

  const h = RG * U / 2 + 1;
  roads.forEach(k => { const [x, z] = rxz(k), [a, b] = P(x, z); g.fillStyle = '#cdb07a'; g.fillRect(a - h - 2, b - h - 2, h * 2 + 4, h * 2 + 4); });

    if (onRiver(x, z)) { g.fillStyle = '#7a4f2a'; g.fillRect(a - h, b - h, h * 2, h * 2); for (let i = 0; i < 5; i++) { g.fillStyle = i % 2 ? '#c08a52' : '#b07a46'; g.fillRect(a - h + 2, b - h + 2 + i * (h * 2 - 4) / 5, h * 2 - 4, (h * 2 - 4) / 5 - 2); } }
    else { g.fillStyle = '#dcc391'; g.fillRect(a - h + 1, b - h + 1, h * 2 - 2, h * 2 - 2); for (let i = 0; i < 3; i++) { g.fillStyle = 'rgba(185,179,166,.9)'; g.beginPath(); g.ellipse(a + (rnd() - .5) * h * 1.4, b + (rnd() - .5) * h * 1.4, h * .22, h * .16, rnd() * 3, 0, 7); g.fill(); } } });

function defaultRoad(){

}
const seaM = new THREE.ShaderMaterial({uniforms: {t: {value: 0}, deep: {value: new THREE.Color(0x2f8fc0)}, shal: {value: new THREE.Color(0x6fd6e8)}, night: {value: 0}, base: {value: 16}, amp: {value: new THREE.Vector4()}, fr: {value: new THREE.Vector4()}, ph: {value: new THREE.Vector4()}},

  const k = cam.dist / innerHeight * .55; cam.tx = Math.max(-20, Math.min(20, drag.tx - (e.clientX - drag.x) * k)); cam.tz = Math.max(-20, Math.min(20, drag.tz - (e.clientY - drag.y) * k * 1.4)); });
const up = e => { if (pts.size === 1 && drag) { if (drag.road) paintRoad(0, 0, true); else if (moved < 8) { if ($('maps').classList.contains('on')) {} else if (edit) editTap(e.clientX, e.clientY); else tap(e.clientX, e.clientY); } }
  pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) drag = null; };
el.addEventListener('pointerup', up); el.addEventListener('pointercancel', e => { pts.delete(e.pointerId); pinch = null; drag = null; painted && paintRoad(0, 0, true); });
el.addEventListener('wheel', e => { e.preventDefault(); cam.dist = Math.max(ZMIN, Math.min(ZMAX, cam.dist * (e.deltaY > 0 ? 1.1 : .9))); }, {passive: false});
$('back').onclick = () => send({type: 'close'});
$('gr').onclick = () => send({type: 'grid'});
$('cl').onclick = () => send({type: 'claim'});

// ---- ゲームから
addEventListener('message', e => { if (e.origin !== location.origin || !e.data || e.data.src !== 'game') return; const d = e.data;
  if (d.type === 'town' && !DATA) { PRICE = d.town.price || {}; const first = d.town.map == null; build(d.town, first ? 0 : d.town.map); DATA.roadsSaved = d.town.roads; setCoins(d.town.coins); if (first) openMaps(false); else focusHome(); }
  if (d.type === 'hud') { const h = d.hud; $('clv').textContent = '🪙' + h.silver.toLocaleString(); $('cl').classList.toggle('dot', h.silver > 0 || h.mats); setCoins(h.coins); }
  if (d.type === 'res' && waits[d.id]) { const f = waits[d.id]; delete waits[d.id]; f(d); } });
send({type: 'ready'});
setTimeout(() => { $('hint').style.opacity = 0; }, 7000);
setTimeout(() => { if (DATA) return;                       // 単体で開いたとき：見本
  PRICE = {road: 20, move: 50, tree1: 300, tree2: 300, tree3: 300, tree4: 300, bush1: 200, flower1: 300, rock1: 150, fence1: 100, bench1: 400, lamp1: 500, fountain1: 2000};
  const D = {map: null, plots: Array.from({length: 25}, (_, i) => i === 12 ? {t: 'bld', img: 'img/town3d/home_1.webp', tag: '自分の家 Lv1'} : i < 10 ? {t: 'empty'} : {t: 'lock'}),
    walkers: ['g20', 'g42', 'g51'].map(k => ({img: 'img/walk/' + k + '.webp'})), deco: [], roads: null};
  // 土地の番号は「近い順」の並び（ゲームと同じ）にする
  const ord = (() => { const c = 2, o = []; for (let i = 0; i < 25; i++) o.push(i); return o.sort((a, b) => (Math.abs(a % 5 - c) + Math.abs((a / 5 | 0) - c)) - (Math.abs(b % 5 - c) + Math.abs((b / 5 | 0) - c)) || a - b); })();
  D.order = ord; build(D, 0); openMaps(false); }, 1200);
</script>
